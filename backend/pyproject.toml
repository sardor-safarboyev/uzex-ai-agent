[project]
name = "backend"
version = "0.1.0"
description = "UZEX AI Agent backend"
readme = "README.md"
authors = [
    { name = "sardor", email = "safarboyev.sardorbek06@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "duckdb>=2.0,<3",
    "fastapi>=0.162.0,<1.0",
    "pydantic>=2.14.2,<3.0",
    "pydantic-settings>=2.16.2,<3.0",
    "uvicorn>=0.54.0,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=9.2.0,<10.0",
    "ruff>=0.17.3,<1.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
