# UZEX production stack (separate compose project "uzex"; does not touch other stacks).
#   internet -> existing Caddy (TLS, Let's Encrypt) -> 172.17.0.1:18080 -> nginx (this stack)
#   nginx: vitality.comma.uz       -> static React app
#          vitality-api.comma.uz   -> FastAPI backend (SSE streaming unbuffered)
name: uzex

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  backend:
    <<: *common
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: /opt/uzex/shared/.env
    environment:
      UZEX_DATABASE_PATH: /data/uzex.duckdb
      UZEX_DATABASE_METADATA_ENABLED: "false"
      UZEX_PRODUCTION: "true"
      UZEX_DATABASE_THREADS: "2"
      UZEX_DATABASE_MEMORY_MB: "1024"
      UZEX_DATABASE_MAX_CONNECTIONS: "4"
      UZEX_DATABASE_QUERY_TIMEOUT_MS: "15000"
      UZEX_QUERY_MAX_RESULTS: "100"
      UZEX_ASK_MAX_CONCURRENT: "8"
      UZEX_CORS_ORIGINS: '["https://vitality.comma.uz"]'
    volumes:
      - type: bind
        source: /opt/uzex/shared/uzex.duckdb
        target: /data/uzex.duckdb
        read_only: true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    <<: *common
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ""   # same-origin /api via nginx; the API domain stays available for clients
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "172.17.0.1:18080:8080"
    depends_on:
      backend: { condition: service_healthy }
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
