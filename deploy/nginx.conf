# Behind Caddy (TLS termination). Routes by Host header.
map $http_x_forwarded_proto $proto { default $http_x_forwarded_proto; "" $scheme; }

upstream uzex_backend { server backend:8000; keepalive 16; }

server {
    listen 8080 default_server;
    server_name vitality.comma.uz _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }
    # same-origin API also available from the front domain
    location /api/ {
        proxy_pass http://uzex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

server {
    listen 8080;
    server_name vitality-api.comma.uz;
    client_max_body_size 32k;
    location / {
        proxy_pass http://uzex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_buffering off;          # SSE streaming
        proxy_cache off;
        proxy_read_timeout 180s;
    }
}
